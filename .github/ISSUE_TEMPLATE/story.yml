name: Story
description: A user-facing feature or change, written from the user's point of view.
title: "[Story] "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        A story describes **what** a user needs and **why**. Leave the **how** to the implementer unless it matters.
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <type of user>, I want <goal> so that <reason>.
      placeholder: As a game master, I want to generate 10 dwarf names at once so that I can name a whole party quickly.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions, one per line. Given / When / Then works well. Every criterion should map to at least one test.
      placeholder: |
        - Given the Dwarf race is selected, when I click Generate, then 10 names are shown
        - Given I click Generate twice, then the second list differs from the first
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this story deliberately does NOT include, to keep it small.
  - type: textarea
    id: notes
    attributes:
      label: Notes, designs, references
      description: Mock-ups, links, technical hints, open questions.
