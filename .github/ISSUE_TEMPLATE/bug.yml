name: Bug
description: Something doesn't work as expected.
title: '[Bug] '
labels: ['type:bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select Elf
        3. Click Generate
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include error messages, screenshots or console output.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 - Blocker (app unusable, no workaround)
        - S2 - Major (feature broken, workaround exists)
        - S3 - Minor (cosmetic or edge case)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, app version or commit.
      placeholder: Chrome 131 on Windows 11, commit abc1234
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Frequency, suspected cause, related issues.
